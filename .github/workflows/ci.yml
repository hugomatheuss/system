name: CI

on:
  push:
    branches: [ '**' ]
  pull_request:
    branches: [ '**' ]

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        php: [8.4]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v3
        with:
          php-version: ${{ matrix.php }}
          extensions: mbstring, xml, ctype, json, pdo, curl
          coverage: none

      - name: Cache Composer
        uses: actions/cache@v4
        with:
          path: ~/.composer/cache
          key: ${{ runner.os }}-composer-${{ hashFiles('**/composer.lock') }}

      - name: Install Composer dependencies
        run: composer install --no-interaction --prefer-dist --no-suggest

      - name: Regenerate autoload optimized
        run: composer dump-autoload -o

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Cache NPM
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: ${{ runner.os }}-node-${{ hashFiles('**/package-lock.json') }}

      - name: Install Node dependencies
        run: npm ci

      - name: Build frontend (optional)
        if: fileExists('package.json')
        run: npm run build --if-present

      - name: Composer validate
        run: composer validate --no-interaction || true

      # Run Pint (style checks)
      - name: Run Pint (style checks)
        run: |
          if [ -f vendor/bin/pint ]; then
            vendor/bin/pint --test
          else
            echo "pint not installed" && exit 1
          fi

      # Run PHPStan (static analysis)
      - name: Run PHPStan (static analysis)
        run: |
          if [ -f vendor/bin/phpstan ]; then
            vendor/bin/phpstan analyse -c phpstan.neon --no-progress
          else
            echo "phpstan not installed" && exit 1
          fi

      # Run Rector in dry-run (via composer script)
      - name: Run Rector (dry-run)
        run: |
          if composer help rector:dry >/dev/null 2>&1; then
            composer rector:dry
          elif [ -f vendor/bin/rector ]; then
            vendor/bin/rector process --dry-run --config=rector.php
          else
            echo "rector not installed" && exit 1
          fi

      # Run PHPUnit (unit tests)
      - name: Run PHPUnit (unit tests)
        run: |
          if [ -f vendor/bin/phpunit ]; then
            vendor/bin/phpunit --testsuite=unit --colors=always
          else
            echo "phpunit not installed" && exit 1
          fi

      - name: Placeholder - additional checks
        run: |
          echo "Add any extra CI steps here (coverage, static analysis reports, artefact upload)"
